name: Build GoodbyeDPI

on:
  push:
    paths:
      - 'src/**'
      - 'windows/**'
      - 'macos/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'windows/**'
      - 'macos/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# This workflow runs repo-provided build code on pull_request, so the default
# GITHUB_TOKEN scopes are far too broad for it. Least privilege: read-only.
permissions:
  contents: read

env:
  WINDIVERT_URL: https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip
  WINDIVERT_NAME: WinDivert-2.2.2-A.zip
  WINDIVERT_BASENAME: WinDivert-2.2.2-A
  WINDIVERT_SHA256: 63cb41763bb4b20f600b6de04e991a9c2be73279e317d4d82f237b150c5f3f15

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The token is not needed after checkout; persist-credentials would leave
      # it in .git/config for every later (repo-provided) build step.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Declare short commit variable
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # The previous wrapped command relied on a helper package that is not
      # present on the current ubuntu-latest image and failed after ~3s.
      # Plain apt-get is robust and idempotent.
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64
        shell: bash

      - name: Download WinDivert from cache
        id: windivert-cache
        uses: actions/cache@v4
        with:
          path: ${{ env. WINDIVERT_NAME }}
          key: ${{ env. WINDIVERT_SHA256 }}

      - name: Download WinDivert from the website
        if: steps.windivert-cache.outputs.cache-hit != 'true'
        run: >
          wget ${{ env. WINDIVERT_URL }} &&
          (echo ${{ env. WINDIVERT_SHA256 }} ${{ env. WINDIVERT_NAME }} | sha256sum -c)

      - name: Unpack WinDivert
        run: unzip ${{ env. WINDIVERT_NAME }}

      - name: Compile x86_64
        run: >
          cd src && make clean &&
          make CPREFIX=x86_64-w64-mingw32- BIT64=1 WINDIVERTHEADERS=../${{ env.WINDIVERT_BASENAME }}/include WINDIVERTLIBS=../${{ env.WINDIVERT_BASENAME }}/x64 -j4

      - name: Prepare x86_64 directory
        run: |
          mkdir goodbyedpi_x86_64_${{ steps.vars.outputs.sha_short }}
          cp src/goodbyedpi.exe ${{ env.WINDIVERT_BASENAME }}/x64/*.{dll,sys} goodbyedpi_x86_64_${{ steps.vars.outputs.sha_short }}

      # The manifest is written inside the staged directory, so the existing
      # directory artifact path picks it up without changing artifact names.
      - name: Write SHA256 manifest x86_64
        run: sha256sum goodbyedpi_x86_64_${{ steps.vars.outputs.sha_short }}/* > goodbyedpi_x86_64_${{ steps.vars.outputs.sha_short }}/SHA256SUMS

      - name: Upload output file x86_64
        uses: actions/upload-artifact@v4
        with:
          name: goodbyedpi_x86_64_${{ steps.vars.outputs.sha_short }}
          path: goodbyedpi_x86_64_${{ steps.vars.outputs.sha_short }}
          retention-days: 14

      - name: Compile i686
        run: >
          cd src && make clean &&
          make CPREFIX=i686-w64-mingw32- WINDIVERTHEADERS=../${{ env.WINDIVERT_BASENAME }}/include WINDIVERTLIBS=../${{ env.WINDIVERT_BASENAME }}/x86 -j4

      - name: Prepare x86 directory
        run: |
          mkdir goodbyedpi_x86_${{ steps.vars.outputs.sha_short }}
          cp src/goodbyedpi.exe ${{ env.WINDIVERT_BASENAME }}/x86/*.{dll,sys} goodbyedpi_x86_${{ steps.vars.outputs.sha_short }}

      - name: Write SHA256 manifest x86
        run: sha256sum goodbyedpi_x86_${{ steps.vars.outputs.sha_short }}/* > goodbyedpi_x86_${{ steps.vars.outputs.sha_short }}/SHA256SUMS

      - name: Upload output file x86
        uses: actions/upload-artifact@v4
        with:
          name: goodbyedpi_x86_${{ steps.vars.outputs.sha_short }}
          path: goodbyedpi_x86_${{ steps.vars.outputs.sha_short }}
          retention-days: 14

  build-macos:
    name: Build macOS (ciadpi)
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel = Intel (x86_64) runner, macos-14 = Apple Silicon (M1).
        # The previous Intel image was retired, so its leg stayed queued forever;
        # macos-15-intel is the current standard Intel label, supported until
        # August 2027.
        os: [macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Declare short commit variable
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pick artifact arch name
        id: arch
        run: |
          if [[ "${{ matrix.os }}" == "macos-15-intel" ]]; then
            echo "name=macos_x86_64" >> "$GITHUB_OUTPUT"
          else
            echo "name=macos_arm64"  >> "$GITHUB_OUTPUT"
          fi

      - name: Sanity-check bash scripts
        run: |
          set -e
          chmod +x macos/build.sh macos/scripts/*.sh
          for f in macos/build.sh macos/scripts/*.sh; do bash -n "$f"; done

      - name: Build ciadpi
        run: ./macos/build.sh

      - name: Stage release directory
        run: |
          set -e
          OUT="goodbyedpi-turkey_${{ steps.arch.outputs.name }}_${{ steps.vars.outputs.sha_short }}"
          mkdir -p "$OUT/bin" "$OUT/scripts" "$OUT/launchd"
          cp macos/bin/ciadpi                                      "$OUT/bin/"
          cp macos/scripts/*.sh                                    "$OUT/scripts/"
          cp macos/launchd/com.cagritaskn.goodbyedpi-turkey.plist.template "$OUT/launchd/"
          # A copy of _lib.sh is required by every script — it's already
          # in macos/scripts/, so the recursive copy above covers it.
          cp macos/README.md                                       "$OUT/README.md" || true
          chmod +x "$OUT/scripts/"*.sh
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: ${{ env.OUT }}
          retention-days: 14
