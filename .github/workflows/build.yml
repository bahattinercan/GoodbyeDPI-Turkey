name: Build GoodbyeDPI

on:
  push:
    # A `release-*` tag push publishes a release (see the `release` job below).
    # GitHub does not evaluate `paths` filters for tag pushes, so a matching
    # tag always runs this workflow no matter which files the tag contains.
    # `branches` must be listed explicitly: with only `tags` defined, GitHub
    # skips the workflow for branch pushes altogether.
    branches:
      - '**'
    tags:
      - 'release-*'
    paths:
      - 'src/**'
      - 'windows/**'
      - 'macos/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'windows/**'
      - 'macos/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# This workflow runs repo-provided build code on pull_request, so the default
# GITHUB_TOKEN scopes are far too broad for it. Least privilege: read-only for
# everything; only the `release` job below grants itself write access.
permissions:
  contents: read

env:
  WINDIVERT_URL: https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip
  WINDIVERT_NAME: WinDivert-2.2.2-A.zip
  WINDIVERT_BASENAME: WinDivert-2.2.2-A
  WINDIVERT_SHA256: 63cb41763bb4b20f600b6de04e991a9c2be73279e317d4d82f237b150c5f3f15

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The token is not needed after checkout; persist-credentials would leave
      # it in .git/config for every later (repo-provided) build step.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Declare short commit variable
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The previous wrapped command relied on a helper package that is not
      # present on the current ubuntu-latest image and failed after ~3s.
      # Plain apt-get is robust and idempotent.
      - name: Install MinGW-w64
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64

      - name: Download WinDivert from cache
        id: windivert-cache
        uses: actions/cache@v4
        with:
          path: ${{ env. WINDIVERT_NAME }}
          key: ${{ env. WINDIVERT_SHA256 }}

      - name: Download WinDivert from the website
        if: steps.windivert-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          wget "${{ env.WINDIVERT_URL }}"
          echo "${{ env.WINDIVERT_SHA256 }}  ${{ env.WINDIVERT_NAME }}" | sha256sum -c

      - name: Unpack WinDivert
        shell: bash
        run: |
          set -euo pipefail
          unzip "${{ env.WINDIVERT_NAME }}"

      - name: Compile x86_64
        shell: bash
        run: |
          set -euo pipefail
          cd src
          make clean
          make CPREFIX=x86_64-w64-mingw32- BIT64=1 \
            WINDIVERTHEADERS=../${{ env.WINDIVERT_BASENAME }}/include \
            WINDIVERTLIBS=../${{ env.WINDIVERT_BASENAME }}/x64 -j4

      - name: Prepare x86_64 directory
        shell: bash
        run: |
          set -euo pipefail
          OUT="goodbyedpi_x86_64_${{ steps.vars.outputs.sha_short }}"
          mkdir "$OUT"
          cp src/goodbyedpi.exe ${{ env.WINDIVERT_BASENAME }}/x64/*.{dll,sys} "$OUT"

      # The launchers, the Turkish readme, the uninstall guide and the licence
      # ship next to the exe so that extracting the ZIP is already a usable
      # install. They are copied before the manifest step on purpose: the
      # manifest must cover every file in the staged directory.
      - name: Add launchers and docs x86_64
        shell: bash
        run: |
          set -euo pipefail
          OUT="goodbyedpi_x86_64_${{ steps.vars.outputs.sha_short }}"
          cp windows/*.cmd "$OUT/"
          cp "windows/README-BEN OKU.txt" "$OUT/"
          cp README.md REVERT.md LICENSE "$OUT/"

      # The manifest is written inside the staged directory, so the existing
      # directory artifact path picks it up without changing artifact names.
      - name: Write SHA256 manifest x86_64
        shell: bash
        run: |
          set -euo pipefail
          OUT="goodbyedpi_x86_64_${{ steps.vars.outputs.sha_short }}"
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS"

      - name: Upload output file x86_64
        uses: actions/upload-artifact@v4
        with:
          name: goodbyedpi_x86_64_${{ steps.vars.outputs.sha_short }}
          path: goodbyedpi_x86_64_${{ steps.vars.outputs.sha_short }}
          retention-days: 14

      - name: Compile i686
        shell: bash
        run: |
          set -euo pipefail
          cd src
          make clean
          make CPREFIX=i686-w64-mingw32- \
            WINDIVERTHEADERS=../${{ env.WINDIVERT_BASENAME }}/include \
            WINDIVERTLIBS=../${{ env.WINDIVERT_BASENAME }}/x86 -j4

      - name: Prepare x86 directory
        shell: bash
        run: |
          set -euo pipefail
          OUT="goodbyedpi_x86_${{ steps.vars.outputs.sha_short }}"
          mkdir "$OUT"
          cp src/goodbyedpi.exe ${{ env.WINDIVERT_BASENAME }}/x86/*.{dll,sys} "$OUT"

      - name: Add launchers and docs x86
        shell: bash
        run: |
          set -euo pipefail
          OUT="goodbyedpi_x86_${{ steps.vars.outputs.sha_short }}"
          cp windows/*.cmd "$OUT/"
          cp "windows/README-BEN OKU.txt" "$OUT/"
          cp README.md REVERT.md LICENSE "$OUT/"

      - name: Write SHA256 manifest x86
        shell: bash
        run: |
          set -euo pipefail
          OUT="goodbyedpi_x86_${{ steps.vars.outputs.sha_short }}"
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS"

      - name: Upload output file x86
        uses: actions/upload-artifact@v4
        with:
          name: goodbyedpi_x86_${{ steps.vars.outputs.sha_short }}
          path: goodbyedpi_x86_${{ steps.vars.outputs.sha_short }}
          retention-days: 14

  build-macos:
    name: Build macOS (ciadpi)
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel = Intel (x86_64) runner, macos-14 = Apple Silicon (M1).
        # The previous Intel image was retired, so its leg stayed queued forever;
        # macos-15-intel is the current standard Intel label, supported until
        # August 2027.
        os: [macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Declare short commit variable
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pick artifact arch name
        id: arch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.os }}" == "macos-15-intel" ]]; then
            echo "name=macos_x86_64" >> "$GITHUB_OUTPUT"
          else
            echo "name=macos_arm64"  >> "$GITHUB_OUTPUT"
          fi

      - name: Sanity-check bash scripts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x macos/build.sh macos/scripts/*.sh
          for f in macos/build.sh macos/scripts/*.sh; do bash -n "$f"; done

      - name: Build ciadpi
        shell: bash
        run: |
          set -euo pipefail
          ./macos/build.sh

      - name: Stage release directory
        shell: bash
        run: |
          set -euo pipefail
          OUT="goodbyedpi-turkey_${{ steps.arch.outputs.name }}_${{ steps.vars.outputs.sha_short }}"
          mkdir -p "$OUT/bin" "$OUT/scripts" "$OUT/launchd"
          cp macos/bin/ciadpi                                      "$OUT/bin/"
          cp macos/scripts/*.sh                                    "$OUT/scripts/"
          cp macos/launchd/com.cagritaskn.goodbyedpi-turkey.plist.template "$OUT/launchd/"
          # A copy of _lib.sh is required by every script — it's already
          # in macos/scripts/, so the recursive copy above covers it.
          cp macos/README.md                                       "$OUT/README.md" || true
          chmod +x "$OUT/scripts/"*.sh
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: ${{ env.OUT }}
          retention-days: 14

  # Publishing. Runs only for a `release-*` tag push: the build artifacts are
  # turned into user-ready packages and published as a GitHub Release. This is
  # the only job that needs write access; the build jobs above stay read-only.
  release:
    name: Publish release
    needs: [build, build-macos]
    if: startsWith(github.ref, 'refs/tags/release-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history so `gh --generate-notes` can walk back to the
          # previous tag.
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The version is derived from the tag, never hardcoded:
      # release-0.2.3rc4-turkey -> 0.2.3rc4-turkey.
      - name: Resolve version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#release-}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            echo "tag '$GITHUB_REF_NAME' is not of the form release-<version>" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version: $VERSION"

      # Flat ZIP root: the launchers sit next to the exe, so a plain "extract
      # all" already produces a working folder. The manifest from the build
      # job is regenerated with plain filenames, since the artifact copy
      # carries the staging directory prefix.
      - name: Package Windows x86_64
        shell: bash
        run: |
          set -euo pipefail
          count=$(find artifacts -mindepth 1 -maxdepth 1 -type d -name 'goodbyedpi_x86_64_*' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "expected exactly one x86_64 Windows artifact, found $count" >&2
            exit 1
          fi
          src=$(find artifacts -mindepth 1 -maxdepth 1 -type d -name 'goodbyedpi_x86_64_*')
          pkg="goodbyedpi-$VERSION"
          mkdir "$pkg"
          cp -R "$src"/. "$pkg"/
          rm -f "$pkg/SHA256SUMS"
          ( cd "$pkg" && sha256sum * > SHA256SUMS )
          zip -q -j "goodbyedpi-$VERSION.zip" "$pkg"/*
          rm -rf "$pkg"

      - name: Package Windows x86
        shell: bash
        run: |
          set -euo pipefail
          count=$(find artifacts -mindepth 1 -maxdepth 1 -type d \
            -name 'goodbyedpi_x86_*' ! -name 'goodbyedpi_x86_64_*' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "expected exactly one 32-bit Windows artifact, found $count" >&2
            exit 1
          fi
          src=$(find artifacts -mindepth 1 -maxdepth 1 -type d \
            -name 'goodbyedpi_x86_*' ! -name 'goodbyedpi_x86_64_*')
          pkg="goodbyedpi-$VERSION-x86"
          mkdir "$pkg"
          cp -R "$src"/. "$pkg"/
          rm -f "$pkg/SHA256SUMS"
          ( cd "$pkg" && sha256sum * > SHA256SUMS )
          zip -q -j "goodbyedpi-$VERSION-x86.zip" "$pkg"/*
          rm -rf "$pkg"

      # Source package: the repository layout is kept inside a versioned top
      # directory. No compiled `ciadpi`: linux/bin/ is gitignored build output
      # and must not be shipped.
      - name: Package Linux sources
        shell: bash
        run: |
          set -euo pipefail
          pkg="goodbyedpi-$VERSION-linux"
          mkdir -p "$pkg/linux"
          cp linux/build.sh linux/Makefile "$pkg/linux/"
          cp -R linux/scripts linux/systemd linux/tests "$pkg/linux/"
          cp linux/README.md "$pkg/linux/README.md"
          cp README.md REVERT.md LICENSE "$pkg/"
          if [ -e "$pkg/linux/bin" ]; then
            echo "refusing to package a prebuilt linux/bin directory" >&2
            exit 1
          fi
          tar -czf "$pkg.tar.gz" "$pkg"
          rm -rf "$pkg"

      - name: Package macOS arm64 and x86_64
        shell: bash
        run: |
          set -euo pipefail
          for arch in arm64 x86_64; do
            count=$(find artifacts -mindepth 1 -maxdepth 1 -type d \
              -name "goodbyedpi-turkey_macos_${arch}_*" | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "expected exactly one macOS ${arch} artifact, found $count" >&2
              exit 1
            fi
            src=$(find artifacts -mindepth 1 -maxdepth 1 -type d \
              -name "goodbyedpi-turkey_macos_${arch}_*")
            pkg="goodbyedpi-$VERSION-macos-$arch"
            mkdir "$pkg"
            cp -R "$src"/. "$pkg"/
            tar -czf "$pkg.tar.gz" "$pkg"
            rm -rf "$pkg"
          done

      # Last step before publishing: one manifest covering every asset.
      - name: Write SHA256SUMS for all assets
        shell: bash
        run: |
          set -euo pipefail
          sha256sum goodbyedpi-*.zip goodbyedpi-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "release-$VERSION" \
            --verify-tag \
            --title "GoodbyeDPI-Turkey $VERSION" \
            --generate-notes \
            "goodbyedpi-$VERSION.zip" \
            "goodbyedpi-$VERSION-x86.zip" \
            "goodbyedpi-$VERSION-linux.tar.gz" \
            "goodbyedpi-$VERSION-macos-arm64.tar.gz" \
            "goodbyedpi-$VERSION-macos-x86_64.tar.gz" \
            SHA256SUMS
